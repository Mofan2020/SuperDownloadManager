<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Download Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SVG 图标 sprite -->

  <symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></symbol>
  <symbol id="i-package" viewBox="0 0 24 24"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="19" r="1.5"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
  <symbol id="i-clipboard" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-columns" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/><line x1="15" y1="4" x2="15" y2="20"/></symbol>
</svg>

<div id="app" class="app">

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark"><svg class="icon icon-lg"><use href="#i-download"/></svg></span>
        <span class="brand-text" data-i18n="listAppName">Super Download Manager</span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-foot">
      <button class="btn btn-ghost btn-block" id="btnSettings">
        <svg class="icon"><use href="#i-settings"/></svg>
        <span class="btn-label" data-i18n="settingsWindowTitle">Settings</span>
      </button>
    </div>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <header class="toolbar" id="toolbar">
      <div class="toolbar-left" id="toolbarTitle"></div>
      <div class="toolbar-right" id="toolbarActions"></div>
    </header>

    <div class="banner-slot" id="bannerSlot"></div>

    <div class="content" id="content">
      <section class="view" id="viewDownloads" data-view="downloads"></section>
      <section class="view" id="viewHistory" data-view="history" hidden></section>
      <section class="view" id="viewSchedule" data-view="schedule" hidden></section>
      <section class="view" id="viewSettings" data-view="settings" hidden></section>
    </div>

    <!-- 状态栏（规格 §2.1）：全局速度 / 活跃任务数 / 限速状态。
         内容由 app.js 填——这里只定结构。 -->
    <footer class="status-bar" id="statusBar">
      <span class="status-item" id="statusSpeed" data-i18n="statusBarSpeed">速度</span>
      <span class="status-dot"></span>
      <span class="status-item" id="statusActive" data-i18n="statusBarActive">活跃</span>
      <span class="status-spacer"></span>
      <span class="status-item" id="statusLimit" data-i18n="statusBarNoLimit">不限速</span>
    </footer>
  </main>

  <!-- 详情抽屉 -->
  <aside class="detail" id="detail" hidden aria-label="Task detail"></aside>
</div>

<!-- 模态层 -->
<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<!-- 右键菜单 -->
<div class="ctxmenu" id="ctxmenu" hidden></div>

<!-- 新建任务对话框（规格 §2.2）
     静态结构写在这儿，行为在 app.js 里接。
     字段全放在 HTML 里（而不是 JS 现搭），是为了让「这个对话框
     到底有哪些字段」一眼能看见——测试也能直接查。 -->
<div class="modal-root" id="addTaskRoot" hidden>
  <div class="modal-backdrop" id="addTaskBackdrop"></div>
  <div class="modal modal-wide" id="addTaskDialog" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="modal-title" data-i18n="addSheetTitle">添加下载</div>
      <button class="btn btn-ghost btn-icon" id="addTaskClose" type="button">
        <svg class="icon"><use href="#i-x"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="form">
        <!-- URL：多行，一行一个，支持批量粘贴 -->
        <div class="field">
          <label class="field-label" for="addUrl" data-i18n="addSheetURLField">URL</label>
          <textarea class="textarea" id="addUrl" rows="3" spellcheck="false"
                    placeholder="https://example.com/file.zip"></textarea>
          <div class="field-row">
            <!-- 探测状态：解析中 / 成功 / 失败（失败不是终态，弹窗不关） -->
            <span class="probe-state" id="addProbeState" hidden></span>
            <span class="field-hint" id="addProbeSize"></span>
            <span class="status-spacer"></span>
            <button class="btn btn-sm" id="addReprobe" type="button" hidden>
              <svg class="icon icon-sm"><use href="#i-refresh"/></svg>
              <span data-i18n="addSheetReprobe">重新解析</span>
            </button>
          </div>
          <div class="modal-error" id="addProbeError" hidden></div>
        </div>

        <div class="field-row">
          <div class="field">
            <label class="field-label" for="addSaveDir" data-i18n="addSheetSaveDirField">保存目录</label>
            <div class="field-row">
              <input class="input" id="addSaveDir" type="text">
              <button class="btn" id="addChooseDir" type="button">
                <svg class="icon icon-sm"><use href="#i-folder"/></svg>
                <span data-i18n="clipboardChoose">选择…</span>
              </button>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="addFilename" data-i18n="addSheetFilenameField">文件名</label>
            <input class="input" id="addFilename" type="text">
            <div class="field-hint" data-i18n="addSheetFilenameHint">留空使用服务器的文件名</div>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label class="field-label" for="addCategory" data-i18n="addSheetCategoryField">分类</label>
            <select class="select" id="addCategory"></select>
          </div>
          <div class="field">
            <label class="field-label" for="addProxy" data-i18n="addSheetProxyField">代理覆盖</label>
            <input class="input" id="addProxy" type="text" placeholder="http://127.0.0.1:7890">
            <div class="field-hint" data-i18n="addSheetProxyHint">留空使用全局代理</div>
          </div>
        </div>

        <!-- 自定义请求头：可编辑的键值行 -->
        <div class="field">
          <label class="field-label" data-i18n="addSheetHeadersField">自定义请求头</label>
          <div class="header-rows" id="addHeaders">
            <div class="header-row" data-header-row>
              <input class="input header-key" type="text" placeholder="User-Agent">
              <input class="input header-value" type="text" placeholder="值">
              <button class="btn btn-ghost btn-icon header-remove" type="button">
                <svg class="icon"><use href="#i-x"/></svg>
              </button>
            </div>
          </div>
          <div class="field-row">
            <button class="btn btn-sm" id="addHeaderAdd" type="button">
              <svg class="icon icon-sm"><use href="#i-plus"/></svg>
              <span data-i18n="addSheetAddHeader">添加请求头</span>
            </button>
            <span class="field-hint" data-i18n="addSheetHeadersHint">按需填写；带 Referer / Cookie 的站点常需要</span>
          </div>
        </div>

        <!-- 分块数：**不给了**。分片本来就是引擎动态规划的（起始连接数
             按文件大小和实测速度自己长），旁边挂一个默认 8 的数字框
             只会让人以为那个数字决定实际分片数——它其实只是个上限，
             用几个由引擎说了算。要限速、去设置页调线程数。 -->
        <div class="field-row">
          <div class="field">
            <label class="field-label" for="addStartWhen" data-i18n="addSheetStartWhenField">开始时机</label>
            <select class="select" id="addStartWhen">
              <option value="now" data-i18n="addSheetStartNow">立即</option>
              <option value="queue" data-i18n="addSheetStartQueue">加入队列</option>
              <option value="scheduled" data-i18n="addSheetStartScheduled">计划</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="addScheduleAt" data-i18n="addSheetScheduleAtField">触发时间</label>
            <input class="input" id="addScheduleAt" type="datetime-local" disabled>
          </div>
        </div>

        <div class="modal-error" id="addError" hidden></div>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn" id="addTaskCancel" type="button" data-i18n="addSheetCancel">取消</button>
      <button class="btn btn-primary" id="addTaskSubmit" type="button" data-i18n="addSheetAdd">添加</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-stack" id="toastStack"></div>

<script src="app.js"></script>
</body>
</html>
