<?xml version="1.0" encoding="UTF-8"?>
<!--
  SuperDownloadManager (SDM) app icon — hand-drawn, MIT-licensed.
  Concept: a bold purple down-arrow (the universal "download" symbol)
  with three horizontal speed lines behind it, on a deep-near-black
  rounded background. No text, no busy decoration, no third-party
  logos. Reads cleanly from 16px to 1024px.

  Palette (kept consistent with the in-app UI):
    bg-inner:    #1B1B1F
    bg-outer:    #0E0E12
    arrow-light: #B197FC  (top of vertical gradient)
    arrow-dark:  #7C3AED  (bottom of vertical gradient)
    speed:       #8B5CF6  (translucent purple for speed lines)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024" height="1024"
     role="img" aria-label="Super Download Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1B1B1F"/>
      <stop offset="1"   stop-color="#0E0E12"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.00"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B197FC"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <clipPath id="mask">
      <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mask)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>

    <!-- Three speed lines, right-aligned so they read as motion
         toward the arrow. We cap their length at 70% of width. -->
    <g fill="#8B5CF6" fill-opacity="0.55">
      <rect x="620" y="312" width="280" height="44" rx="22"/>
      <rect x="660" y="432" width="240" height="44" rx="22"/>
      <rect x="700" y="552" width="200" height="44" rx="22"/>
    </g>

    <!-- Down-arrow: vertical stem + rounded triangular head.
         Built as a single closed path so the silhouette is one
         piece. Top of the head is a soft round (~28px radius).
         Bottom corners of the head (where the head meets the
         imaginary floor) are also rounded. The two diagonal
         sides are straight lines — that's what makes it read
         as an arrow at 16px instead of a teardrop. -->
    <g fill="url(#arrow)">
      <!-- Stem: from y=200 to y=560 (overlaps the head, so the
           union is a single shape with no visible seam). -->
      <rect x="432" y="200" width="160" height="424" rx="80"/>
      <!-- Head: triangle with rounded top + rounded bottom
           corners. Apex at (512, 420), base corners at
           (300, 720) and (724, 720), each corner rounded by
           36px. -->
      <path d="M 512 384
               A 32 32 0 0 1 542 405
               L 720 684
               A 36 36 0 0 1 700 720
               L 324 720
               A 36 36 0 0 1 304 684
               L 482 405
               A 32 32 0 0 1 512 384
               Z"
            fill="url(#arrow)"/>
    </g>
  </g>

  <!-- Subtle outer rim highlight -->
  <rect x="1" y="1" width="1022" height="1022" rx="228" ry="228"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.06"
        stroke-width="2"/>
</svg>
