name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pymain/requirements.txt
          # pyinstaller 要装：test_app_icon.py 靠它内置的默认图标
          # 判断「--icon 有没有生效」——不装就 ModuleNotFoundError。
          python -m pip install pytest ruff pyinstaller

      - name: Lint
        working-directory: pymain
        run: ruff check sdm tests scripts

      - name: Test
        working-directory: pymain
        # **`-vv` 不是为了好看，是为了能查挂死。**
        #
        # `pyproject.toml` 里的 `addopts = "-q"` 抵掉了命令行上的
        # `-v`，输出退回「每个文件一行点号」。一旦某个用例挂死，
        # 日志里就只有一行点号——看不出是哪个用例，还以为是整个
        # 文件挂了。两个 `-v` 抵掉 `-q` 之后是逐个用例一行，
        # 挂在哪、哪个失败、失败原因是什么，一目了然。
        #
        # `-rf` 让失败在最后再汇总一次（挂死时汇总那部分看不到，
        # 但失败用例的 traceback 会在当场打出来）。
        run: python -m pytest tests -vv -rf

  no-pyobjc:
    name: Test (no PyObjC)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pymain/requirements.txt
          # pyinstaller 要装：test_app_icon.py 靠它内置的默认图标
          # 判断「--icon 有没有生效」——不装就 ModuleNotFoundError。
          python -m pip install pytest pyinstaller

      # 在 macOS 上屏蔽掉 PyObjC，跑一遍全量。
      #
      # matrix 里的 ubuntu-latest 本来就没有 PyObjC，那边红了这步
      # 也会红——但要等 CI 跑完才知道。这步在本机就把问题暴露出来：
      # 写 macOS 专属的测试时很容易只顾着当前平台能跑通（比如
      # fake 只注入了 UserNotifications，忘了 Foundation 也得注入），
      # macOS 上真 PyObjC 兜住了，测试绿，Linux runner 上才炸。
      #
      # 挡掉的模块和抛出的异常类型跟真 Linux 一致，见
      # tests/no_pyobjc.py 的说明。
      - name: Test without PyObjC
        working-directory: pymain
        env:
          PYTHONPATH: tests
        run: python -m pytest tests -v -p no_pyobjc

  self-test:
    name: GUI self-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pymain/requirements.txt

      - name: GUI self-test
        working-directory: pymain
        run: python -m sdm.gui.main --self-test
