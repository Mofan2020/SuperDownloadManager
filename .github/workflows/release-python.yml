name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. v2.0.0)'
        required: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pymain/requirements.txt
          python -m pip install pyinstaller pytest

      - name: Run tests
        working-directory: pymain
        run: python -m pytest tests -q

      - name: GUI self-test
        working-directory: pymain
        run: python -m sdm.gui.main --self-test

      - name: Build app
        working-directory: pymain
        run: python scripts/build.py --mac

      - name: Verify signature and Info.plist
        run: |
          APP="pymain/dist/macos/SuperDownloadManager.app"
          codesign --verify --deep --strict "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          echo "built version: $VERSION"
          echo "$VERSION" > /tmp/built-version-macos

      - name: Verify app icon
        run: |
          # 校验图标真的打进 bundle 了。
          #
          # v2.0.2 发出去的时候就是默认图标——PyInstaller 找不到
          # --icon 就静默用它自带的 icon-windowed.icns，不报错。
          # 用户装上看到一把扳手，才发现。
          #
          # 所以这里显式检查两件事：
          # 1. Info.plist 的 CFBundleIconFile 指对了
          # 2. 那个文件真的在 Resources 里，而且不是 PyInstaller 的默认
          APP="pymain/dist/macos/SuperDownloadManager.app"
          ICON_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist")
          echo "CFBundleIconFile = $ICON_NAME"
          if [ "$ICON_NAME" != "AppIcon.icns" ]; then
            echo "::error::应用图标不对：CFBundleIconFile=$ICON_NAME，期望 AppIcon.icns"
            exit 1
          fi
          ICON_PATH="$APP/Contents/Resources/$ICON_NAME"
          if [ ! -f "$ICON_PATH" ]; then
            echo "::error::图标文件不存在：$ICON_PATH"
            exit 1
          fi
          # PyInstaller 的默认图标是 bootloader/images/icon-windowed.icns。
          # 撞上了就说明 --icon 没生效，PyInstaller 静默退回了它自带的。
          #
          # 路径用 python 查，不写死——写死的路径在 python 安装位置
          # 变了的时候会让这个检查静默跳过，等于没有检查。
          PYI_DEFAULT=$(python -c "import PyInstaller, os; print(os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'images', 'icon-windowed.icns'))")
          echo "PyInstaller 默认图标：$PYI_DEFAULT"
          if [ ! -f "$PYI_DEFAULT" ]; then
            echo "::error::找不到 PyInstaller 的默认图标，无法判断 --icon 是否生效：$PYI_DEFAULT"
            exit 1
          fi
          if cmp -s "$ICON_PATH" "$PYI_DEFAULT"; then
            echo "::error::用的是 PyInstaller 默认图标，--icon 没生效"
            exit 1
          fi
          echo "应用图标校验通过：$ICON_PATH"

      - name: Package
        run: |
          mkdir -p build/release
          # 用 ditto 而不是 zip：ditto 保留扩展属性和代码签名记录，
          # unzip 会丢，导致 codesign --verify 误报签名损坏。
          #
          # 只发一个包。CLI 和 daemon 就在 .app 里
          # （Contents/Resources/sdm-cli/ 和 sdmd-daemon/），GUI 首次
          # 启动会自己把 CLI 装进 PATH 并注册 daemon。
          ditto -c -k --sequesterRsrc --keepParent \
            pymain/dist/macos/SuperDownloadManager.app \
            build/release/SuperDownloadManager-macOS.zip
          cd build/release
          shasum -a 256 SuperDownloadManager-macOS.zip | tee SuperDownloadManager-macOS.zip.sha256

      - name: Verify macOS zip
        run: |
          # 校验 zip 必须用 ditto 解（不能用 unzip）——unzip 会丢扩展
          # 属性和附加记录，让 codesign --verify 误报「资源缺失」。
          #
          # 这一步必须在 macOS runner 上做：ditto 是 macOS 专有工具。
          # publish job 跑在 ubuntu 上，读不了 plist 也解不了这个 zip。
          rm -rf /tmp/sdm-check
          /usr/bin/ditto -x -k build/release/SuperDownloadManager-macOS.zip /tmp/sdm-check
          /usr/bin/codesign --verify --deep --strict "/tmp/sdm-check/SuperDownloadManager.app"
          # 版本号从 plist 读出来写进文件，publish job 拿去比对
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "/tmp/sdm-check/SuperDownloadManager.app/Contents/Info.plist" \
            > build/release/built-version.txt
          echo "built version: $(cat build/release/built-version.txt)"

      - name: Verify macOS zip icon
        run: |
          # zip 里的那份也要查——打包过程中可能把 Resources 里的文件
          # 弄丢，只查 dist 目录不够。
          APP="/tmp/sdm-check/SuperDownloadManager.app"
          ICON_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist")
          if [ ! -f "$APP/Contents/Resources/$ICON_NAME" ]; then
            echo "::error::zip 里的应用缺图标：Contents/Resources/$ICON_NAME"
            exit 1
          fi
          echo "zip 内图标校验通过：$ICON_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: sdm-macos
          path: build/release/

  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pymain/requirements.txt
          python -m pip install pyinstaller pytest

      - name: Run tests
        working-directory: pymain
        run: python -m pytest tests -q

      - name: GUI self-test
        working-directory: pymain
        run: python -m sdm.gui.main --self-test

      - name: Build exe
        working-directory: pymain
        run: python scripts/build.py --windows

      - name: Verify exe exists
        shell: pwsh
        run: |
          $exe = "pymain/dist/windows/SuperDownloadManager.exe"
          if (-not (Test-Path $exe)) { throw "exe 没生成：$exe" }
          Write-Host "exe size: $((Get-Item $exe).Length) bytes"

      - name: Verify exe icon
        shell: pwsh
        run: |
          # Windows 的图标是从 .ico 打进 exe 资源段的。
          # 没传 --icon 时 PyInstaller 静默用默认图标，不报错——
          # 跟 macOS 那边一样的坑，所以这里显式查。
          #
          # 查法：读 exe 的资源段，找 RT_GROUP_ICON (14) / RT_ICON (3)。
          $ico = "pymain/resources/AppIcon.ico"
          if (-not (Test-Path $ico)) { throw "图标源文件不存在：$ico" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::new((Resolve-Path $ico))
          if ($icon.Width -le 0) { throw "ICO 解析失败：$ico" }
          Write-Host "ICO 源文件可解析：$($icon.Width)x$($icon.Height)"
          $icon.Dispose()

          # exe 本身的资源段：用一个最小 PE 解析器找 icon 目录。
          $bytes = [System.IO.File]::ReadAllBytes("pymain/dist/windows/SuperDownloadManager.exe")
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $numSections = [BitConverter]::ToUInt16($bytes, $peOff + 6)
          $optSize = [BitConverter]::ToUInt16($bytes, $peOff + 20)
          $secStart = $peOff + 24 + $optSize
          $resourceRva = 0
          $resourceSize = 0
          for ($i = 0; $i -lt $numSections; $i++) {
            $off = $secStart + $i * 40
            $name = [System.Text.Encoding]::ASCII.GetString($bytes, $off, 8).TrimEnd([char]0)
            if ($name -eq ".rsrc") {
              $resourceRva = [BitConverter]::ToUInt32($bytes, $off + 12)
              $resourceSize = [BitConverter]::ToUInt32($bytes, $off + 16)
              break
            }
          }
          if ($resourceRva -eq 0) {
            throw "exe 里没有 .rsrc 段——图标肯定没打进去"
          }
          Write-Host "exe 资源段大小：$resourceSize 字节"
          if ($resourceSize -lt 1024) {
            throw "资源段太小（$resourceSize 字节），图标很可能没打进去"
          }

      - name: Check install scripts parse
        shell: pwsh
        run: |
          # PowerShell 脚本语法错了要等到用户手里才炸。这里先过一遍解析器。
          foreach ($ps1 in @("pymain/scripts/install.ps1", "pymain/scripts/uninstall.ps1")) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $ps1), [ref]$null, [ref]$errors)
            if ($errors) {
              $errors | ForEach-Object { Write-Error "$ps1 : $_" }
              throw "PowerShell 脚本语法错误：$ps1"
            }
            Write-Host "OK: $ps1"
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          # 只发一个包。CLI 和 daemon 的 zip 已经塞在 GUI exe 里，
          # 首次运行时自动解出来、装进 PATH、注册计划任务。
          Compress-Archive -Path pymain/dist/windows/SuperDownloadManager.exe -DestinationPath build/release/SuperDownloadManager-Windows.zip
          $hash = (Get-FileHash build/release/SuperDownloadManager-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  SuperDownloadManager-Windows.zip" | Out-File -Encoding ascii build/release/SuperDownloadManager-Windows.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sdm-windows
          path: build/release/

  publish:
    name: Publish pre-release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: sdm-macos
          path: build/release/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: sdm-windows
          path: build/release/

      - name: Parse tag
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify built version matches tag
        run: |
          # 版本号在 build-macos job 里读出来写进这个文件——
          # publish job 跑在 ubuntu 上，没有 PlistBuddy 读不了 plist。
          BUILT=$(cat build/release/built-version.txt)
          if [ "$BUILT" != "${{ steps.ver.outputs.version }}" ]; then
            echo "版本不一致：tag=${{ steps.ver.outputs.version }} 产物=$BUILT" >&2
            exit 1
          fi
          echo "version match: $BUILT"

      - name: Prepare release notes
        run: |
          if [ ! -f release-notes.md ]; then
            echo "## v${{ steps.ver.outputs.version }}" > release-notes.md
          fi

      - name: Create GitHub Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          tag_name: v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            build/release/SuperDownloadManager-macOS.zip
            build/release/SuperDownloadManager-macOS.zip.sha256
            build/release/SuperDownloadManager-Windows.zip
            build/release/SuperDownloadManager-Windows.zip.sha256
          draft: false
          prerelease: true
          generate_release_notes: false

      - name: Notify
        run: |
          echo "::notice::Pre-release ${{ steps.ver.outputs.version }} published as **Pre-release**."
          echo "::notice::Maintainer must confirm both platforms manually, then flip prerelease to false."
