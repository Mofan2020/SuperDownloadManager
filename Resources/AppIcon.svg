<?xml version="1.0" encoding="UTF-8"?>
<!--
  SDM app icon — hand-drawn, MIT-licensed.
  Concept: an arrow forming the body of an "S" download glyph.
  Background: deep gray (#1F1F23) with the iconic SDM purple (#8B5CF6)
  foreground that maps to the in-app hover button. Three speed lines
  drop from the arrowhead to suggest parallelism.

  All artwork is original; no third-party branding is incorporated.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#26262C"/>
            <stop offset="100%" stop-color="#0E0E12"/>
        </linearGradient>
        <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#A78BFA"/>
            <stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect x="0" y="0" width="1024" height="1024" rx="216" fill="url(#bgGrad)"/>

    <!-- Outer ring (subtle) -->
    <circle cx="512" cy="512" r="395" fill="none"
            stroke="#3A3A42" stroke-width="6"/>

    <!-- Three short speed lines on either side (parallel workers) -->
    <g fill="#A78BFA">
        <rect x="160" y="392" width="100" height="22" rx="11"/>
        <rect x="160" y="500" width="74" height="22" rx="11"/>
        <rect x="160" y="608" width="100" height="22" rx="11"/>
        <rect x="764" y="392" width="100" height="22" rx="11"/>
        <rect x="790" y="500" width="74" height="22" rx="11"/>
        <rect x="764" y="608" width="100" height="22" rx="11"/>
    </g>

    <!-- Trunk of the S-shape -->
    <path d="M 320 320
             Q 320 240, 400 240
             L 624 240
             Q 704 240, 704 320
             Q 704 400, 624 400
             L 400 400
             Q 320 400, 320 480
             Q 320 560, 400 560
             L 624 560
             Q 704 560, 704 624"
        fill="none"
        stroke="url(#accentGrad)"
        stroke-width="118"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

    <!-- Arrowhead -->
    <polygon points="560,690 720,690 640,860"
             fill="url(#accentGrad)"
             stroke="#0E0E12"
             stroke-width="6"
             filter="url(#glow)"/>
</svg>
